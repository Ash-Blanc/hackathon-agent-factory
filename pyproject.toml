[project]
name = "hackathon-agent-factory"
version = "0.1.0"
description = "Autonomous Hackathon Agent Factory Loop: Discovery, Competitive Intelligence, Ideation, and Sandbox Building"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "rich>=13.9.4",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "click>=8.1.8",
    "agno>=3.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["scrapers", "intel", "factory"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
